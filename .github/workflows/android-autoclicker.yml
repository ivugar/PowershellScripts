name: Build AutoClicker APK

on:
  push:
    paths:
      - 'AndroidAutoClicker/**'
      - '.github/workflows/android-autoclicker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidAutoClicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk autoclicker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-apk
          path: AndroidAutoClicker/autoclicker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autoclicker-latest
          name: AutoClicker APK
          body: Последняя сборка автокликера. Скачайте autoclicker.apk на телефон и установите.
          files: AndroidAutoClicker/autoclicker.apk
          make_latest: true
