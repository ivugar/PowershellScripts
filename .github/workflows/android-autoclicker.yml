name: Build AutoClicker APK

on:
  push:
    paths:
      - 'AndroidAutoClicker/**'
      - '.github/workflows/android-autoclicker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidAutoClicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create signing key
        run: |
          echo "SIGNING_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SIGNING_STORE=$RUNNER_TEMP/autoclicker.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          keytool -genkeypair -keystore "$SIGNING_STORE" -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" -alias autoclicker -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=AutoClicker"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk autoclicker.apk

      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose autoclicker.apk
          "$BT/aapt2" dump badging autoclicker.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-apk
          path: AndroidAutoClicker/autoclicker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autoclicker-latest
          name: AutoClicker APK
          body: Последняя сборка автокликера. Скачайте autoclicker.apk на телефон и установите.
          files: AndroidAutoClicker/autoclicker.apk
          make_latest: true
