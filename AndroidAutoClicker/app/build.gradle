plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivugar.autoclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ivugar.autoclicker'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Ключ подписи передаётся через переменные окружения (его создаёт workflow сборки)
    signingConfigs {
        release {
            storeFile System.getenv('SIGNING_STORE') ? file(System.getenv('SIGNING_STORE')) : null
            storePassword System.getenv('SIGNING_PASSWORD')
            keyAlias 'autoclicker'
            keyPassword System.getenv('SIGNING_PASSWORD')
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
